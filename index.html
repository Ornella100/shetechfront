};

const verifierToken = (req, res, next) => {
    const authHeader = req.headers['authorization'];
    const token = authHeader && authHeader.split(' ')[1];
    if (!token) return res.status(401).json({ message: "Accès refusé — token manquant" });
    try {
        req.user = jwt.verify(token, process.env.JWT_SECRET);
        next();
    } catch {
        return res.status(403).json({ message: "Token invalide ou expiré" });
    }
};

const verifierAdmin = (req, res, next) => {
    if (req.user.role !== 'admin')
        return res.status(403).json({ message: "Accès réservé aux admins" });
    next();
};

// ✅ NOUVEAU — Mentor ET admin peuvent accéder
const verifierMentorOuAdmin = (req, res, next) => {
    if (req.user.role !== 'admin' && req.user.role !== 'mentor')
        return res.status(403).json({ message: "Accès réservé aux mentors et admins" });
    next();
};

app.post('/register', async (req, res) => {
    const { nom, email, mot_de_passe } = req.body;
    if (!nom || !email || !mot_de_passe)
        return res.status(400).json({ message: "Tous les champs sont obligatoires" });
    if (mot_de_passe.length < 6)
        return res.status(400).json({ message: "Minimum 6 caractères" });

    db.query('SELECT email, nom FROM users WHERE email = ? OR nom = ?', [email, nom], async (err, result) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (result.some(u => u.email === email))
            return res.status(409).json({ message: "Cet email est déjà utilisé" });
        if (result.some(u => u.nom === nom))
            return res.status(409).json({ message: "Ce nom est déjà pris" });

        const hash = await bcrypt.hash(mot_de_passe, 10);
        db.query('INSERT INTO users (nom, email, mot_de_passe, role) VALUES (?, ?, ?, ?)',
            [nom, email, hash, 'apprenante'],
            (err, result) => {
                if (err) return res.status(500).json({ message: "Erreur serveur" });
                res.status(201).json({ message: "Compte créé avec succès", id: result.insertId });
            });
    });
});

app.post('/login', (req, res) => {
    const { email, mot_de_passe } = req.body;
    if (!email || !mot_de_passe)
        return res.status(400).json({ message: "Email et mot de passe obligatoires" });

    db.query('SELECT * FROM users WHERE email = ?', [email], async (err, result) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (result.length === 0)
            return res.status(404).json({ message: "Aucun compte trouvé avec cet email" });

        const user = result[0];
        let match = false;
        try { match = await bcrypt.compare(mot_de_passe, user.mot_de_passe); } catch {}
        if (!match && user.mot_de_passe === mot_de_passe) {
            match = true;
            bcrypt.hash(mot_de_passe, 10, (e, h) => {
                if (!e) db.query('UPDATE users SET mot_de_passe = ? WHERE id = ?', [h, user.id], () => {});
            });
        }
        if (!match) return res.status(401).json({ message: "Mot de passe incorrect" });

        const token = jwt.sign({ id: user.id, role: user.role }, process.env.JWT_SECRET, { expiresIn: '24h' });
        res.status(200).json({
            message: "Connexion réussie", token,
            user: { id: user.id, nom: user.nom, email: user.email, role: user.role, niveau: user.niveau }
        });
    });
});

app.post('/forgot-password', async (req, res) => {
    const { email } = req.body;
    if (!email) return res.status(400).json({ message: "Email obligatoire" });
    db.query('SELECT * FROM users WHERE email = ?', [email], async (err, result) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (result.length === 0) return res.json({ message: "Si cet email existe, un lien a été envoyé." });

        const token = crypto.randomBytes(32).toString('hex');
        const expiresAt = new Date(Date.now() + 3600000);
        db.query('INSERT INTO password_reset_tokens (email, token, expires_at) VALUES (?, ?, ?)',
            [email, token, expiresAt], async (err) => {
                if (err) return res.status(500).json({ message: "Erreur serveur" });
                const resetLink = `${process.env.FRONTEND_URL || 'http://localhost:5173'}/reset-password?token=${token}`;
                try {
                    await transporter.sendMail({
                        from: `"SheTech" <${process.env.GMAIL_USER}>`, to: email,
                        subject: 'Réinitialisation mot de passe - SheTech',
                        html: `<p>Cliquez ici pour réinitialiser : <a href="${resetLink}">${resetLink}</a></p><p>Valable 1 heure.</p>`
                    });
                    res.json({ message: "Si cet email existe, un lien a été envoyé." });
                } catch (e) {
                    res.status(500).json({ message: "Erreur envoi email." });
                }
            });
    });
});

app.get('/formations/:id', (req, res) => {
    db.query('SELECT * FROM formations WHERE id = ?', [req.params.id], (err, formation) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (formation.length === 0) return res.status(404).json({ message: "Formation introuvable" });
        db.query('SELECT * FROM modules WHERE formation_id = ? ORDER BY id ASC', [req.params.id], (err, modules) => {
            if (err) return res.status(500).json({ message: "Erreur serveur" });
            if (modules.length === 0) return res.status(200).json({ formation: formation[0], modules });
            const ids = modules.map(m => m.id);
            db.query(`SELECT * FROM lecons WHERE module_id IN (${ids.map(() => '?').join(',')}) ORDER BY module_id, id`,
                ids, (err, lecons) => {
                    if (err) return res.status(500).json({ message: "Erreur serveur" });
                    modules.forEach(m => { m.lecons = lecons.filter(l => l.module_id === m.id); });
                    res.status(200).json({ formation: formation[0], modules });
                });
        });
    });
});

app.post('/modules/:id/generate-quiz', verifierToken, verifierAdmin, async (req, res) => {
    const { id } = req.params;
    const { nb_questions = 5 } = req.body;
    db.query('SELECT * FROM modules WHERE id = ?', [id], (err, modules) => {
        if (err || modules.length === 0) return res.status(404).json({ message: "Module introuvable" });
        const mod = modules[0];
        db.query('SELECT titre, contenu_texte, type FROM lecons WHERE module_id = ? ORDER BY id ASC', [id], async (err, lecons) => {
            if (err) return res.status(500).json({ message: "Erreur serveur" });
            const contenu = lecons.map((l, i) => `Leçon ${i+1} : ${l.titre}\n${l.contenu_texte || ''}`).join('\n\n').trim();
            if (!contenu) return res.status(400).json({ message: "Aucun contenu texte dans les leçons." });
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`, 'HTTP-Referer': 'http://localhost:5173', 'X-Title': 'SheTech' },
                    body: JSON.stringify({ model: 'openrouter/auto', messages: [{ role: 'user', content: `Génère ${nb_questions} questions QCM en français basées sur "${mod.titre}".\nContenu:\n${contenu}\nRéponds UNIQUEMENT avec un tableau JSON sans markdown:\n[{"question":"...","option_a":"...","option_b":"...","option_c":"...","option_d":"...","reponse_correcte":"a","explication":"..."}]` }], max_tokens: 2000, temperature: 0.7 })
                });
                if (!response.ok) return res.status(500).json({ message: "Erreur OpenRouter API" });
                const data = await response.json();
                const text = data.choices?.[0]?.message?.content || '';
                const questions = JSON.parse(text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim());
                res.status(200).json({ questions, module_titre: mod.titre });
            } catch (err) {
                res.status(500).json({ message: "Erreur génération quiz", detail: err.message });
            }
        });
    });
});

app.post('/modules/:id/quiz/soumettre', verifierToken, (req, res) => {
    const { reponses } = req.body;
    db.query('SELECT * FROM module_quiz WHERE module_id = ? ORDER BY ordre ASC', [req.params.id], (err, questions) => {
        if (err || questions.length === 0) return res.status(404).json({ message: "Quiz introuvable" });
        let correct = 0;
        const details = questions.map(q => {
            const ok = reponses[q.id] === q.reponse_correcte;
            if (ok) correct++;
            return { id: q.id, question: q.question, reponse_user: reponses[q.id], reponse_correcte: q.reponse_correcte, correct: ok, explication: q.explication };
        });
        const score = Math.round((correct / questions.length) * 100);
        const reussi = score >= 70;
        db.query(`INSERT INTO module_quiz_resultats (user_id, module_id, score, reussi) VALUES (?, ?, ?, ?) ON DUPLICATE KEY UPDATE score=VALUES(score), reussi=VALUES(reussi), updated_at=CURRENT_TIMESTAMP`,
            [req.user.id, req.params.id, score, reussi ? 1 : 0], (err) => {
                if (err) return res.status(500).json({ message: "Erreur serveur" });
                res.status(200).json({ score, reussi, correct, total: questions.length, details, message: reussi ? "Félicitations ! Module suivant débloqué." : `Score ${score}/100. Il faut 70% minimum.` });
            });
    });
});

// POST — ajouter un commentaire (tous les rôles)
app.post('/projets/:projet_id/commentaires', verifierToken, (req, res) => {
    const { contenu, note } = req.body;
    if (!contenu || !contenu.trim())
        return res.status(400).json({ message: "Le contenu est obligatoire" });

    // La note est réservée aux mentors et admins
    const noteFinal = (req.user.role === 'mentor' || req.user.role === 'admin')
        ? (note || null)
        : null;

    db.query(
        `INSERT INTO commentaires_projets (projet_id, user_id, contenu, note)
         VALUES (?, ?, ?, ?)`,
        [req.params.projet_id, req.user.id, contenu.trim(), noteFinal],
        (err, result) => {
            if (err) return res.status(500).json({ message: "Erreur serveur", detail: err.message });
            res.status(201).json({
                id: result.insertId,
                projet_id: parseInt(req.params.projet_id),
                user_id: req.user.id,
                contenu: contenu.trim(),
                note: noteFinal,
                created_at: new Date()
            });
        }
    );
});

// DELETE — supprimer un commentaire
app.delete('/commentaires/:id', verifierToken, (req, res) => {
    const condition = req.user.role === 'admin' ? 'WHERE id = ?' : 'WHERE id = ? AND user_id = ?';
    const params = req.user.role === 'admin' ? [req.params.id] : [req.params.id, req.user.id];
    db.query(`DELETE FROM commentaires_projets ${condition}`, params, (err, result) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (result.affectedRows === 0)
            return res.status(404).json({ message: "Commentaire introuvable ou accès refusé" });
        res.status(200).json({ message: "Commentaire supprimé" });
    });
});

/* ══════════════════════════════════════════
   COMMUNAUTÉ
══════════════════════════════════════════ */
app.get('/community/posts', (req, res) => {
    const { search = '', category = 'tous' } = req.query;
    let query = `SELECT p.*, u.nom AS author_name, u.niveau, COUNT(DISTINCT pr.id) AS response_count, COUNT(DISTINCT v.id) AS votes, (SELECT COUNT(*) FROM community_votes WHERE target_type='post' AND target_id=p.id AND user_id=?) AS user_voted FROM community_posts p JOIN users u ON p.user_id = u.id LEFT JOIN community_responses pr ON p.id = pr.post_id LEFT JOIN community_votes v ON p.id = v.target_id AND v.target_type='post' WHERE 1=1`;
    const params = [req.user?.id || 0];
    if (search) { query += ' AND (p.title LIKE ? OR p.content LIKE ?)'; params.push(`%${search}%`, `%${search}%`); }
    if (category !== 'tous') { query += ' AND p.category = ?'; params.push(category); }
    query += ' GROUP BY p.id ORDER BY p.is_solved ASC, p.created_at DESC LIMIT 100';
    db.query(query, params, (err, r) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        res.status(200).json(r);
    });
});

app.get('/community/users', (req, res) => {

app.post('/community/follow', verifierToken, (req, res) => {
    const { following_id } = req.body;
    if (following_id === req.user.id) return res.status(400).json({ message: "Tu ne peux pas te suivre toi-même" });
    db.query('INSERT INTO user_follows (follower_id, following_id) VALUES (?, ?)',
        [req.user.id, following_id], (err) => {
            if (err && err.code === 'ER_DUP_ENTRY') return res.status(409).json({ message: "Déjà suivi" });
            if (err) return res.status(500).json({ message: "Erreur serveur" });
            res.status(201).json({ message: "Utilisateur suivi" });
        });
});

            if (r.affectedRows === 0) return res.status(404).json({ message: "Suivi introuvable" });

        });
});

app.post('/projets/:projet_id/livrables', verifierToken, upload.single('fichier'), (req, res) => {
    const { titre } = req.body;
    if (!titre || !titre.trim()) return res.status(400).json({ message: "Le titre est obligatoire" });
    const fichier_url = req.file ? `/uploads/livrables/${req.file.filename}` : null;
    db.query('SELECT id FROM projets WHERE id = ? AND user_id = ?', [req.params.projet_id, req.user.id], (err, r) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (r.length === 0) return res.status(403).json({ message: "Projet introuvable ou accès refusé" });
        db.query('INSERT INTO livrables (projet_id, titre, fichier_url) VALUES (?, ?, ?)',
            [req.params.projet_id, titre.trim(), fichier_url], (err, r) => {
                if (err) return res.status(500).json({ message: "Erreur serveur" });
                res.status(201).json({ id: r.insertId, projet_id: parseInt(req.params.projet_id), titre: titre.trim(), fichier_url });
            });
    });
});

app.delete('/livrables/:id', verifierToken, (req, res) => {
    db.query('SELECT fichier_url FROM livrables WHERE id = ?', [req.params.id], (err, results) => {
        if (err) return res.status(500).json({ message: "Erreur serveur" });
        if (results.length === 0) return res.status(404).json({ message: "Livrable introuvable" });
        const fichier_url = results[0].fichier_url;
        db.query(`SELECT l.id FROM livrables l JOIN projets p ON l.projet_id = p.id WHERE l.id = ? AND p.user_id = ?`,
            [req.params.id, req.user.id], (err, r) => {
                if (err) return res.status(500).json({ message: "Erreur serveur" });
                if (r.length === 0) return res.status(403).json({ message: "Accès refusé" });
                db.query('DELETE FROM livrables WHERE id = ?', [req.params.id], (err) => {
                    if (err) return res.status(500).json({ message: "Erreur serveur" });
                    if (fichier_url) {
                        fs.unlink(path.join(__dirname, fichier_url), (e) => {
                            if (e) console.error("Erreur suppression fichier:", e);
                        });
                    }
                    res.status(200).json({ message: "Livrable supprimé" });
                });
            });
    });
});
